services:
  mongo:
    # OACIS v4 requires a (single-node) replica set: ParameterSet creation
    # uses multi-document transactions. rs.initiate is performed by the
    # one-shot mongo-init service below; an existing standalone data volume
    # is converted in place automatically.
    image: mongo:8.0.10
    command: ["--replSet", "rs0"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Requiring mongod to be PID 1 prevents a temporary bootstrap process
      # from being reported as ready. The node is healthy only once the
      # replica set has elected itself writable primary.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = mongod && mongosh --quiet --eval \"quit(db.hello().isWritablePrimary ? 0 : 1)\""]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
  mongo-init:
    # one-shot: initiates the single-node replica set (no-op when already
    # initiated) and seeds the default Host documents (idempotent)
    image: mongo:8.0.10
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ["bash", "/docker-init/init_mongo_data.sh"]
    volumes:
      - ./init_mongo_data.sh:/docker-init/init_mongo_data.sh:ro
    restart: "no"
  redis:
    image: redis:8.0.1
    healthcheck:
      test: ["CMD-SHELL", "response=$$(redis-cli ping) && test \"$$response\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  oacis:
    image: oacis/oacis:${OACIS_IMAGE_TAG:-latest}
    volumes:
      - ./Result:/home/oacis/oacis/public/Result_development
    environment:
      - LOCAL_UID
      - LOCAL_GID
      - LOCAL_USER
      - OACIS_MONGODB_URL=mongo:27017
      - OACIS_REDIS_URL=redis:6379
    ports:
      - "${HOST_IP:-127.0.0.1}:${OACIS_PORT:-3000}:3000"
    tty: true
    extra_hosts:
      - "gateway.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:3000/"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 180s

volumes:
  mongo_data:
